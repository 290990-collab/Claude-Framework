name = "library"
description = "Reusable libraries and packages: the public contract is the product."
critical_surface = "The public contract — signatures, semantics, behaviour across versions: breaking it breaks code that is not in this repository."

agents = ["debugger", "api-scout", "security-reviewer"]
on_demand = []
cycles = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
]

[settings.permissions]
deny = ["Read(./**/*.env)", "Read(./**/*.key)", "Read(./**/*.pem)"]
