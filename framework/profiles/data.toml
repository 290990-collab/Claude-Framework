name = "data"
description = "Pipeline di dati: acquisizione, trasformazione, archiviazione, indicizzazione."

agents = ["debugger", "data-ingestion", "data-quality-reviewer", "infra", "api-scout"]
on_demand = ["compliance-reviewer", "perf-analyst", "security-reviewer"]
cycles = []

shared = [
  "core/conventions.md",
  "core/coding-standards.md",
  "core/architecture-guide.md",
  "core/testing-guide.md",
  "core/debugging-playbook.md",
  "core/review-checklist.md",
  "domain/data-guide.md",
]

[settings.permissions]
deny = [
  "Read(./**/*.env)", "Read(./**/*.key)", "Read(./**/*.pem)",
  "Read(./**/dumps/**)", "Read(./**/exports/**)",
]
